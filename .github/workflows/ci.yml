name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: bazel test (rules_remotivelabs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Test
        run: bazel test //... --test_output=errors

  example-tests:
    name: bazel test (example consumer)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/remotive_topology
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          module-root: examples/remotive_topology

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # and without them Bazel never registers the linux-sandbox strategy.
      # Bazel probes for sandbox support once per server, so this has to
      # happen before the first bazel command starts the server.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The topology actions declare `requires-network`. Prove the tag grants
      # network where the sandbox blocks it by default; requesting
      # linux-sandbox explicitly makes this fail loudly instead of silently
      # falling back to an unsandboxed strategy. The probe line reports why
      # the sandbox is unavailable if it ever is.
      #
      # This runs before the plain test step and with the disk cache off:
      # the sandbox flags don't enter the action key, so a cached topology
      # action (from the other step or from a previous run's disk cache)
      # would pass this step without ever executing under the sandbox.
      - name: Test under network-blocking sandbox
        run: |
          "$(bazel info install_base)/linux-sandbox" -- /bin/true
          bazel test //... --test_output=errors \
            --spawn_strategy=linux-sandbox \
            --sandbox_default_allow_network=false \
            --disk_cache=

      - name: Test
        run: bazel test //... --test_output=errors

  buildifier:
    name: buildifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install buildifier
        env:
          BUILDIFIER_VERSION: "8.5.1"
        run: |
          set -eo pipefail
          curl -fsSL -o /tmp/buildifier \
            "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64"
          chmod +x /tmp/buildifier
          sudo mv /tmp/buildifier /usr/local/bin/buildifier
          buildifier --version

      - name: Format check
        run: buildifier -r -mode=check .

      - name: Lint
        run: buildifier -r -mode=check -lint=warn .
